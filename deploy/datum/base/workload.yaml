apiVersion: compute.datumapis.com/v1alpha
kind: Workload
metadata:
  name: milo-os-com
spec:
  template:
    spec:
      runtime:
        class: general-purpose
        resources:
          instanceType: datumcloud/d1-standard-2
        sandbox:
          containers:
            - name: app
              image: ghcr.io/milo-os/milo-os-com:latest-compute
              env:
                # Datum networks are IPv6 only: an IPv4-only socket never answers.
                - name: HOST
                  value: "::"
              envFrom:
                - secretRef:
                    name: milo-os-com-secrets
              ports:
                - name: http
                  port: 4321
                  protocol: TCP
      networkInterfaces:
        - name: eth0
          network:
            name: default
          ipFamilies:
            - IPv6
          reclaimPolicy: Delete
  placements:
    - name: default
      locations:
        - name: us-central-1
      scaleSettings:
        minReplicas: 1
        instanceManagementPolicy: OrderedReady
