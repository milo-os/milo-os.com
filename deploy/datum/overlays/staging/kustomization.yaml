apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../../base

images:
  - name: ghcr.io/milo-os/milo-os-com
    newTag: v1.2.5

patches:
  - target:
      kind: Workload
      name: milo-os-com
    patch: |
      - op: replace
        path: /spec/template/spec/runtime/sandbox/containers/0/env/2/value
        value: "https://www.milo-os.com/"
