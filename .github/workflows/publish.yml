name: Publish Website

on:
  push:
    paths-ignore:
      - "README.md"
      - "env.example"
      - ".vscode/**"

  release:
    types: ["published"]

jobs:
  # Built with `datumctl compute build` instead of the shared
  # datum-cloud/actions publish-docker.yaml workflow (or a plain
  # docker/build-push-action step). A normal docker/OCI container build,
  # however clean, is a linux/amd64 container image; Datum Compute's unikernel
  # runtime class doesn't boot those — it boots a distinct "kraftcloud"-
  # platform artifact that only datumctl's own "Packaging root filesystem" /
  # "Assembling Compute image" steps produce. A plain build's image reports
  # ImageUnavailable ("The instance image could not be pulled") on unikernel
  # Instances even though it pulls and runs fine on general-purpose ones.
  publish-container-image:
    permissions:
      id-token: write
      contents: read
      packages: write
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.meta.outputs.version }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/milo-os/milo-os-com
          tags: |
            type=ref,event=pr,suffix=-{{commit_date 'YYYYMMDD-HHmmss'}},prefix=v0.0.0-
            type=ref,event=branch,suffix=-{{commit_date 'YYYYMMDD-HHmmss'}},prefix=v0.0.0-
            type=semver,pattern=v{{version}}
            type=sha,prefix=v0.0.0-

      - name: Install datumctl
        run: |
          curl -fsSL -o /tmp/datumctl.tar.gz \
            https://github.com/datum-cloud/datumctl/releases/latest/download/datumctl_Linux_x86_64.tar.gz
          tar -xzf /tmp/datumctl.tar.gz -C /tmp datumctl
          sudo install -m 0755 /tmp/datumctl /usr/local/bin/datumctl
          datumctl plugin install compute

      - name: Build and Push Compute Image
        run: |
          datumctl compute build --push \
            --output ghcr.io/milo-os/milo-os-com:${{ steps.meta.outputs.version }} \
            .

  publish-kustomize-bundles:
    needs: publish-container-image
    permissions:
      id-token: write
      contents: read
      packages: write
    uses: datum-cloud/actions/.github/workflows/publish-kustomize-bundle.yaml@v1.14.0
    with:
      bundle-name: ghcr.io/milo-os/milo-os-com-kustomize
      bundle-path: config
      image-overlays: config/base
      image-name: ghcr.io/milo-os/milo-os-com
      debug: true
    secrets: inherit
